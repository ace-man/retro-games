<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="earthGrad" x1="64" y1="62" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c98549"/>
      <stop offset="60%" stop-color="#945625"/>
      <stop offset="100%" stop-color="#5e3211"/>
    </linearGradient>
    <radialGradient id="pitHole" cx="50%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#4a270f"/>
      <stop offset="65%" stop-color="#291306"/>
      <stop offset="100%" stop-color="#140802"/>
    </radialGradient>
    <linearGradient id="grassTop" x1="12" y1="54" x2="116" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#69f58b"/>
      <stop offset="100%" stop-color="#22ad4e"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="78" y1="56" x2="104" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#edf7ff"/>
      <stop offset="100%" stop-color="#87a6c2"/>
    </linearGradient>
  </defs>

  <!-- Soil bank / cutaway hill -->
  <path d="M10 72 C10 60 32 54 64 54 C96 54 118 60 118 72 V102 C118 114 96 122 64 122 C32 122 10 114 10 102 Z" fill="url(#earthGrad)" stroke="#4d260c" stroke-width="2.8"/>

  <!-- Green grassy rim -->
  <path d="M10 74 C10 58 32 52 64 52 C96 52 118 58 118 74 C118 82 104 86 92 84 C84 74 44 74 36 84 C24 86 10 82 10 74 Z" fill="url(#grassTop)" stroke="#156e32" stroke-width="2.6"/>

  <!-- Pile of dug-out dirt on left side -->
  <path d="M16 68 C20 50 38 48 46 66 Z" fill="#b87239" stroke="#5e3211" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="28" cy="60" r="2.2" fill="#7a4419"/>
  <circle cx="36" cy="63" r="2.6" fill="#7a4419"/>

  <!-- Deep dark dug PIT right in the middle -->
  <ellipse cx="64" cy="86" rx="34" ry="20" fill="url(#pitHole)" stroke="#47220a" stroke-width="3.2"/>
  <!-- Inner earthen wall lip showing depth -->
  <path d="M32 82 C38 70 90 70 96 82 C90 76 38 76 32 82 Z" fill="#82491d"/>
  <!-- Pebbles inside/around pit -->
  <ellipse cx="52" cy="96" rx="5" ry="3" fill="#633616"/>
  <ellipse cx="75" cy="94" rx="4" ry="2.5" fill="#633616"/>

  <!-- Bright red-handled garden spade stuck in the soil next to the pit -->
  <g transform="translate(86 48) rotate(16)">
    <!-- Handle shaft -->
    <rect x="-3.5" y="-30" width="7" height="42" rx="3" fill="#e6a25c" stroke="#6e3c14" stroke-width="2.2"/>
    <!-- Red D-grip -->
    <path d="M-11 -30 C-11 -40 11 -40 11 -30 Z" fill="none" stroke="#ff3b5c" stroke-width="5.5" stroke-linejoin="round"/>
    <rect x="-12" y="-33" width="24" height="5.5" rx="2.5" fill="#ff3b5c" stroke="#9e142c" stroke-width="1.8"/>
    <!-- Metallic shovel blade -->
    <path d="M-11 8 H11 L9 24 C8 29 4 32 0 33 C-4 32 -8 29 -9 24 Z" fill="url(#bladeGrad)" stroke="#4c6782" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M-5 12 V24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
