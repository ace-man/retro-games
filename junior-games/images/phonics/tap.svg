<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="pipeGrad" x1="20" y1="36" x2="96" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2f8ff"/>
      <stop offset="45%" stop-color="#b7d2e8"/>
      <stop offset="100%" stop-color="#6b8ba8"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="28" y1="14" x2="80" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#9ec3e6"/>
      <stop offset="100%" stop-color="#53789c"/>
    </linearGradient>
    <radialGradient id="drop1" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c4f7ff"/>
      <stop offset="45%" stop-color="#38d9ff"/>
      <stop offset="100%" stop-color="#1378e6"/>
    </radialGradient>
    <linearGradient id="wallPlate" x1="10" y1="38" x2="28" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d7e8f7"/>
      <stop offset="100%" stop-color="#6a85a1"/>
    </linearGradient>
  </defs>

  <!-- Wall mounting flange -->
  <rect x="10" y="38" width="14" height="38" rx="6" fill="url(#wallPlate)" stroke="#4c647d" stroke-width="2.5"/>

  <!-- Main curved chrome faucet body -->
  <path d="M22 46 H74 C88 46 98 56 98 70 V78 H76 V70 C76 66 74 64 70 64 H22 Z" fill="url(#pipeGrad)" stroke="#4c647d" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Spout lip -->
  <rect x="72" y="75" width="30" height="9" rx="4.5" fill="url(#pipeGrad)" stroke="#4c647d" stroke-width="2.5"/>

  <!-- Specular highlight on faucet -->
  <path d="M26 51 H72 C82 51 89 57 91 66" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Valve collar & stem -->
  <rect x="44" y="34" width="20" height="13" rx="4" fill="url(#pipeGrad)" stroke="#4c647d" stroke-width="2.5"/>
  <rect x="49" y="22" width="10" height="14" rx="3" fill="url(#handleGrad)" stroke="#4c647d" stroke-width="2.5"/>

  <!-- Cross handle -->
  <rect x="28" y="16" width="52" height="11" rx="5.5" fill="url(#handleGrad)" stroke="#4c647d" stroke-width="2.5"/>
  <circle cx="54" cy="21.5" r="5" fill="#38d9ff" stroke="#1860b8" stroke-width="2"/>
  <circle cx="32" cy="21.5" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="76" cy="21.5" r="3" fill="#ffffff" opacity="0.7"/>

  <!-- Big glossy falling water drop -->
  <path d="M87 88 C87 88 100 103 100 111 C100 118.2 94.2 124 87 124 C79.8 124 74 118.2 74 111 C74 103 87 88 87 88 Z" fill="url(#drop1)" stroke="#0f5bb5" stroke-width="2.2"/>
  <ellipse cx="82.5" cy="109" rx="3.2" ry="5.5" transform="rotate(-18 82.5 109)" fill="#ffffff" opacity="0.8"/>

  <!-- Small sparkle splash drops -->
  <circle cx="70" cy="98" r="4" fill="url(#drop1)"/>
  <circle cx="105" cy="95" r="3.5" fill="url(#drop1)"/>
</svg>
