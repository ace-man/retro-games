<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="glassGrad" x1="28" y1="38" x2="94" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#edf7ff"/>
      <stop offset="50%" stop-color="#c3ddf5"/>
      <stop offset="100%" stop-color="#7fa3c7"/>
    </linearGradient>
    <linearGradient id="inkGrad" x1="34" y1="62" x2="88" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5d4dff"/>
      <stop offset="55%" stop-color="#2c24a8"/>
      <stop offset="100%" stop-color="#140e5e"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="42" y1="16" x2="80" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#596582"/>
      <stop offset="50%" stop-color="#2e354d"/>
      <stop offset="100%" stop-color="#171b2b"/>
    </linearGradient>
    <linearGradient id="splatGrad" x1="82" y1="88" x2="118" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6b5cff"/>
      <stop offset="100%" stop-color="#231c8f"/>
    </linearGradient>
  </defs>

  <!-- Glossy ink splat next to bottle -->
  <path d="M94 96 C100 90 112 94 114 102 C116 110 108 118 98 117 C88 116 84 108 87 101 Z" fill="url(#splatGrad)"/>
  <circle cx="115" cy="92" r="4.5" fill="#5d4dff"/>
  <circle cx="110" cy="117" r="3.5" fill="#3b30c7"/>
  <ellipse cx="98" cy="102" rx="4" ry="2.2" transform="rotate(-20 98 102)" fill="#a59cff" opacity="0.7"/>

  <!-- Bottle cap / stopper -->
  <rect x="44" y="14" width="34" height="19" rx="5" fill="url(#capGrad)" stroke="#121524" stroke-width="2.5"/>
  <line x1="51" y1="18" x2="51" y2="29" stroke="#7684a6" stroke-width="2" stroke-linecap="round"/>
  <line x1="61" y1="18" x2="61" y2="29" stroke="#7684a6" stroke-width="2" stroke-linecap="round"/>
  <line x1="71" y1="18" x2="71" y2="29" stroke="#7684a6" stroke-width="2" stroke-linecap="round"/>

  <!-- Glass bottle neck & shoulder -->
  <path d="M47 33 H75 V45 C87 50 94 60 94 74 V102 C94 111 87 117 78 117 H44 C35 117 28 111 28 102 V74 C28 60 35 50 47 45 Z" fill="url(#glassGrad)" stroke="#4c6c8c" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Rich glowing blue-indigo ink inside -->
  <path d="M33 70 C44 65 56 73 68 68 C78 64 85 67 89 71 V101 C89 107 84 112 77 112 H45 C38 112 33 107 33 101 Z" fill="url(#inkGrad)"/>
  <ellipse cx="61" cy="70" rx="26" ry="4.5" fill="#7c6eff" opacity="0.65"/>

  <!-- Cream label with ink drop emblem -->
  <rect x="42" y="79" width="38" height="23" rx="6" fill="#fffdf5" stroke="#c8b99a" stroke-width="2"/>
  <path d="M61 83 C61 83 68 91 68 95 C68 98.8 64.9 101.5 61 101.5 C57.1 101.5 54 98.8 54 95 C54 91 61 83 61 83 Z" fill="#3a2fd4"/>
  <circle cx="58.8" cy="94" r="1.7" fill="#a8a1ff"/>

  <!-- Glass shine highlight -->
  <path d="M36 62 C36 57 40 53 45 50" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M35 76 V100" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Cute ink drip on rim -->
  <path d="M72 34 C72 39 75 43 75 47 C75 49.5 73 51 71 51 C69 51 67.5 49.5 67.5 47 C67.5 43 70 39 70 34 Z" fill="#463ae6"/>
