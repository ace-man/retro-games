              ctx.fill();
              ctx.fillStyle = "#fff";
              ctx.beginPath();
              ctx.arc(-r * 0.33, -r * 0.05, r * 0.032, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = "#184673";
              ctx.lineWidth = Math.max(2, r * 0.048);
              ctx.beginPath();
              ctx.arc(-r * 0.34, r * 0.12, r * 0.16, 0.05 * Math.PI, 0.7 * Math.PI);
              ctx.stroke();
              break;
            }
            case "fish": {
              // Tail fin
              ctx.fillStyle = "#ff6b35";
              ctx.beginPath();
              ctx.moveTo(r * 0.35, 0);
              ctx.lineTo(r * 0.78, -r * 0.34 + wag * r);
              ctx.lineTo(r * 0.78, r * 0.34 + wag * r);
              ctx.closePath();
              ctx.fill();
              // Top fin
              ctx.fillStyle = "#ff9f1c";
              ctx.beginPath();
              ctx.ellipse(0, -r * 0.42, r * 0.26, r * 0.15, -0.2, 0, Math.PI * 2);
              ctx.fill();
              // Body
              ctx.fillStyle = "#ff822e";
              ctx.beginPath();
              ctx.ellipse(-r * 0.06, 0, r * 0.54, r * 0.4, 0, 0, Math.PI * 2);
              ctx.fill();
              // Clownfish white stripe
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.ellipse(r * 0.06, 0, r * 0.11, r * 0.37, 0, 0, Math.PI * 2);
              ctx.fill();
              // Big friendly eye
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(-r * 0.28, -r * 0.08, r * 0.14, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#1d1d26";
              ctx.beginPath();
              ctx.arc(-r * 0.3, -r * 0.08, r * 0.08, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#fff";
              ctx.beginPath();
              ctx.arc(-r * 0.32, -r * 0.11, r * 0.03, 0, Math.PI * 2);
              ctx.fill();
              // Cute mouth
              ctx.strokeStyle = "#8a2b0d";
              ctx.lineWidth = Math.max(2, r * 0.05);
              ctx.beginPath();
              ctx.arc(-r * 0.42, r * 0.12, r * 0.1, 0.1, Math.PI * 0.65);
              ctx.stroke();
              break;
            }
            case "cow": {
              // Horns
              ctx.fillStyle = "#f2c66d";
              ctx.beginPath();
              ctx.ellipse(-r * 0.34, -r * 0.56, r * 0.1, r * 0.18, -0.35, 0, Math.PI * 2);
              ctx.ellipse(r * 0.34, -r * 0.56, r * 0.1, r * 0.18, 0.35, 0, Math.PI * 2);
              ctx.fill();
              // Ears
              ctx.fillStyle = "#33333d";
              ctx.beginPath();
              ctx.ellipse(-r * 0.62, -r * 0.26, r * 0.2, r * 0.12, -0.3, 0, Math.PI * 2);
              ctx.ellipse(r * 0.62, -r * 0.26, r * 0.2, r * 0.12, 0.3, 0, Math.PI * 2);
              ctx.fill();
              // White head
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.ellipse(0, -r * 0.04, r * 0.56, r * 0.54, 0, 0, Math.PI * 2);
              ctx.fill();
              // Cow black spot
              ctx.fillStyle = "#2b2b36";
              ctx.beginPath();
              ctx.ellipse(r * 0.24, -r * 0.32, r * 0.22, r * 0.16, 0.4, 0, Math.PI * 2);
              ctx.fill();
              // Big pink snout
              ctx.fillStyle = "#ffabc4";
              ctx.beginPath();
              ctx.ellipse(0, r * 0.24, r * 0.46, r * 0.28, 0, 0, Math.PI * 2);
              ctx.fill();
              // Nostrils
              ctx.fillStyle = "#b85c78";
              ctx.beginPath();
              ctx.ellipse(-r * 0.16, r * 0.2, r * 0.055, r * 0.08, -0.2, 0, Math.PI * 2);
              ctx.ellipse(r * 0.16, r * 0.2, r * 0.055, r * 0.08, 0.2, 0, Math.PI * 2);
              ctx.fill();
              drawCuteEyes(r, 0.22, -0.14, 0.085, blink);
              drawSmile(r, 0.26, 0.14);
              break;
            }
            case "pig": {
              // Pointy pink ears
              ctx.fillStyle = "#ff8eb3";
              ctx.beginPath();
              ctx.ellipse(-r * 0.44, -r * 0.46, r * 0.19, r * 0.22, -0.45, 0, Math.PI * 2);
              ctx.ellipse(r * 0.44, -r * 0.46, r * 0.19, r * 0.22, 0.45, 0, Math.PI * 2);
              ctx.fill();
              // Round rosy head
              ctx.fillStyle = "#ffa8c6";
              ctx.beginPath();
              ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2);
              ctx.fill();
              // Snout
              ctx.fillStyle = "#ff78a5";
              ctx.beginPath();
              ctx.ellipse(0, r * 0.14, r * 0.28, r * 0.2, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#a8385e";
              ctx.beginPath();
              ctx.ellipse(-r * 0.1, r * 0.14, r * 0.05, r * 0.08, 0, 0, Math.PI * 2);
              ctx.ellipse(r * 0.1, r * 0.14, r * 0.05, r * 0.08, 0, 0, Math.PI * 2);
              ctx.fill();
              drawCuteEyes(r, 0.24, -0.14, 0.085, blink);
              drawCheeks(r, 0.4, 0.1);
              break;
            }
            case "dolphin": {
              // Dorsal fin
              ctx.fillStyle = "#2b90d9";
              ctx.beginPath();
              ctx.moveTo(-r * 0.05, -r * 0.34);
              ctx.quadraticCurveTo(r * 0.1, -r * 0.72, r * 0.24, -r * 0.3);
              ctx.closePath();
              ctx.fill();
              // Tail
              ctx.fillStyle = "#2b90d9";
              ctx.beginPath();
              ctx.moveTo(r * 0.42, r * 0.14);
              ctx.lineTo(r * 0.76, -r * 0.12 + wag * r);
              ctx.lineTo(r * 0.72, r * 0.36 + wag * r);
              ctx.closePath();
              ctx.fill();
              // Curved body + beak
              ctx.fillStyle = "#52b6f5";
              ctx.beginPath();
              ctx.ellipse(0, r * 0.02, r * 0.56, r * 0.38, -0.1, 0, Math.PI * 2);
              ctx.fill();
              ctx.beginPath();
              ctx.ellipse(-r * 0.56, r * 0.12, r * 0.22, r * 0.11, 0.15, 0, Math.PI * 2);
              ctx.fill();
              // Light belly
              ctx.fillStyle = "#d9f3ff";
              ctx.beginPath();
              ctx.ellipse(-r * 0.06, r * 0.22, r * 0.4, r * 0.16, -0.08, 0, Math.PI * 2);
              ctx.fill();
              // Eye
              ctx.fillStyle = "#1d1d26";
              ctx.beginPath();
              ctx.arc(-r * 0.26, -r * 0.04, r * 0.08, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#fff";
              ctx.beginPath();
              ctx.arc(-r * 0.28, -r * 0.07, r * 0.03, 0, Math.PI * 2);
              ctx.fill();
              break;
            }
            case "octopus": {
              // 6 wiggly tentacles
              ctx.strokeStyle = "#9b5de5";
              ctx.lineWidth = Math.max(6, r * 0.17);
              ctx.lineCap = "round";
              [-0.48, -0.28, -0.09, 0.09, 0.28, 0.48].forEach((tx, idx) => {
                ctx.beginPath();
                ctx.moveTo(tx * r * 0.7, r * 0.2);
                ctx.quadraticCurveTo(
                  tx * r * 1.15 + Math.sin(elapsed * 3.5 + idx) * (reducedMotion ? 0 : r * 0.08),
                  r * 0.52,
                  tx * r * 1.25,
                  r * 0.62
                );
                ctx.stroke();
              });
              // Round head
              ctx.fillStyle = "#b073ff";
              ctx.beginPath();
              ctx.ellipse(0, -r * 0.08, r * 0.52, r * 0.48, 0, 0, Math.PI * 2);
              ctx.fill();
              drawCuteEyes(r, 0.2, -0.06, 0.1, blink);
              drawCheeks(r, 0.34, 0.1);
              drawSmile(r, 0.1, 0.14);
              break;
            }
            case "dog": {
              // Floppy brown ears
              ctx.fillStyle = "#a35e28";
              ctx.beginPath();
              ctx.ellipse(-r * 0.56, r * 0.02, r * 0.2, r * 0.36, 0.2 + wag * 0.4, 0, Math.PI * 2);
              ctx.ellipse(r * 0.56, r * 0.02, r * 0.2, r * 0.36, -0.2 - wag * 0.4, 0, Math.PI * 2);
              ctx.fill();
              // Head
              ctx.fillStyle = "#f2b263";
              ctx.beginPath();
              ctx.arc(0, -r * 0.02, r * 0.56, 0, Math.PI * 2);
              ctx.fill();
              // Light snout
              ctx.fillStyle = "#ffe8c2";
              ctx.beginPath();
              ctx.ellipse(0, r * 0.18, r * 0.28, r * 0.22, 0, 0, Math.PI * 2);
              ctx.fill();
              // Happy pink tongue
              ctx.fillStyle = "#ff6b8a";
              ctx.beginPath();
              ctx.ellipse(0, r * 0.38, r * 0.1, r * 0.13, 0, 0, Math.PI * 2);
              ctx.fill();
              // Nose
              ctx.fillStyle = "#3a2216";
              ctx.beginPath();
              ctx.ellipse(0, r * 0.08, r * 0.12, r * 0.085, 0, 0, Math.PI * 2);
              ctx.fill();
              drawCuteEyes(r, 0.22, -0.14, 0.088, blink);
              drawSmile(r, 0.16, 0.14);
              break;
            }
            case "sheep": {
              // Fluffy cloud wool puffs
              ctx.fillStyle = "#ffffff";
              for (let i = 0; i < 10; i++) {
                const a = (i * Math.PI * 2) / 10;
                ctx.beginPath();
                ctx.arc(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.48, r * 0.24, 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.beginPath();
              ctx.arc(0, 0, r * 0.52, 0, Math.PI * 2);
              ctx.fill();
              // Cute ears
              ctx.fillStyle = "#4d4347";
              ctx.beginPath();
              ctx.ellipse(-r * 0.5, -r * 0.04, r * 0.18, r * 0.1, -0.25, 0, Math.PI * 2);
              ctx.ellipse(r * 0.5, -r * 0.04, r * 0.18, r * 0.1, 0.25, 0, Math.PI * 2);
              ctx.fill();
              // Dark face
              ctx.fillStyle = "#5c5257";
              ctx.beginPath();
              ctx.ellipse(0, r * 0.08, r * 0.38, r * 0.36, 0, 0, Math.PI * 2);
              ctx.fill();
              // Fluffy forehead tuft
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(-r * 0.12, -r * 0.24, r * 0.16, 0, Math.PI * 2);
              ctx.arc(r * 0.12, -r * 0.24, r * 0.16, 0, Math.PI * 2);
              ctx.arc(0, -r * 0.28, r * 0.17, 0, Math.PI * 2);
              ctx.fill();
              // Bright eyes on dark face
              [-1, 1].forEach((s) => {
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(s * r * 0.16, r * 0.04, r * 0.09, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#1d1d26";
                ctx.beginPath();
                ctx.arc(s * r * 0.16, r * 0.04, r * 0.05, 0, Math.PI * 2);
                ctx.fill();
              });
              ctx.strokeStyle = "#ffd6e4";
              ctx.lineWidth = Math.max(2, r * 0.045);
              ctx.beginPath();
              ctx.arc(0, r * 0.2, r * 0.1, 0.15 * Math.PI, 0.85 * Math.PI);
              ctx.stroke();
              break;
            }
            case "bird": {
              // Flapping wing
              ctx.fillStyle = "#2274e0";
              ctx.beginPath();
              ctx.ellipse(r * 0.16, r * 0.05 + wag * r * 0.6, r * 0.34, r * 0.22, -0.35 + wag, 0, Math.PI * 2);
              ctx.fill();
              // Plump bluebird body
              ctx.fillStyle = "#3ba9ff";
              ctx.beginPath();
              ctx.arc(-r * 0.04, r * 0.02, r * 0.52, 0, Math.PI * 2);
              ctx.fill();
              // Sunny belly
              ctx.fillStyle = "#ffe57a";
              ctx.beginPath();
              ctx.ellipse(-r * 0.16, r * 0.22, r * 0.28, r * 0.24, 0, 0, Math.PI * 2);
              ctx.fill();
              // Golden beak
              ctx.fillStyle = "#ff9f1c";
              ctx.beginPath();
              ctx.moveTo(-r * 0.5, -r * 0.06);
              ctx.lineTo(-r * 0.8, r * 0.04);
              ctx.lineTo(-r * 0.48, r * 0.16);
              ctx.closePath();
              ctx.fill();
              // Eye
              ctx.fillStyle = "#1d1d26";
              ctx.beginPath();

            case "bee": {

            case "elephant": {

        function drawAnimalToken(animal, isDragged, isSelected) {
          const r = animal.r;
          const isSettled = animal.state === "settled";
          const bob =
            reducedMotion || isDragged
              ? 0
              : Math.sin(elapsed * (isSettled ? 2.6 : 2.1) + animal.phase) * (isSettled ? 4 : 3);
          const bounceScale =
            animal.bounceTimer > 0 && !reducedMotion
              ? 1 + Math.sin(animal.bounceTimer * 18) * 0.14 * animal.bounceTimer
              : 1;
          const idleNudge =
            !reducedMotion && mode === "play" && animal.state === "tray" && idleTime > 4.5
              ? 1 + Math.sin(elapsed * 5 + animal.phase) * 0.055
              : 1;
          const baseScale = isDragged ? 1.18 : isSettled ? 0.92 : 1.0;
          const scale = baseScale * bounceScale * idleNudge;

          ctx.save();
          ctx.translate(animal.x, animal.y + bob);
          ctx.scale(scale, scale);

          // Drop shadow (bigger when lifted during drag)
          ctx.save();
          ctx.fillStyle = isDragged ? "rgba(0, 0, 0, 0.34)" : "rgba(0, 0, 0, 0.24)";
          ctx.beginPath();
          ctx.ellipse(0, isDragged ? r * 1.12 : r * 0.88, r * (isDragged ? 0.78 : 0.72), r * 0.22, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Soft circular badge behind unsorted/dragged animals for clear touch affordance
          if (!isSettled) {
            ctx.save();
            ctx.fillStyle = animal.def.badge || "#ffffff";
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = isDragged || isSelected ? 5 : 3.5;
            ctx.strokeStyle = isDragged || isSelected ? "#ffe14d" : "rgba(255, 255, 255, 0.92)";
            ctx.stroke();

            if (isDragged || isSelected) {
              ctx.strokeStyle = "rgba(255, 225, 77, 0.45)";
              ctx.lineWidth = 10;
              ctx.beginPath();
              ctx.arc(0, 0, r + 5, 0, Math.PI * 2);
              ctx.stroke();
            }
            ctx.restore();
          }

          drawAnimalArtwork(animal.id, r * 0.96, animal.phase);
          ctx.restore();
        }

        function drawStagingTray() {
          if (!roundAnimals.length) return;
          // Draw soft empty nest circles where each unsorted animal rests
          for (let i = 0; i < roundAnimals.length; i++) {
            const a = roundAnimals[i];
            ctx.save();
            ctx.beginPath();
            ctx.arc(a.homeX, a.homeY, a.r * 1.04, 0, Math.PI * 2);
            if (a.state === "settled") {
              ctx.fillStyle = "rgba(57, 229, 140, 0.16)";
              ctx.fill();
              ctx.strokeStyle = "rgba(57, 229, 140, 0.45)";
              ctx.lineWidth = 2.5;
              ctx.stroke();
              // Friendly little golden star in completed slot
              ctx.fillStyle = "#ffe14d";
              drawStar(a.homeX, a.homeY, a.r * 0.34, a.r * 0.16, 5);
              ctx.fill();
            } else {
              ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
              ctx.fill();
              ctx.setLineDash([7, 7]);
              ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
              ctx.lineWidth = 2.5;
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        function drawIdleHint() {
          if (mode !== "play" || activeDrag || idleTime < 4.5) return;
          const nextAnimal = roundAnimals.find((a) => a.state === "tray");
          if (!nextAnimal) return;
          const pulse = reducedMotion ? 0.5 : (elapsed * 1.1) % 1;
          const yOffset = -nextAnimal.r * 1.25 - pulse * 26;
          const alpha = Math.sin(pulse * Math.PI) * 0.85;

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = "#ffe14d";
          ctx.beginPath();
          ctx.moveTo(nextAnimal.x, nextAnimal.y + yOffset - 12);
          ctx.lineTo(nextAnimal.x - 12, nextAnimal.y + yOffset + 6);
          ctx.lineTo(nextAnimal.x + 12, nextAnimal.y + yOffset + 6);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        function drawSpeechBubble() {
          if (!speechBubble) return;
          const alpha = Math.min(1, speechBubble.timer * 2.5);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.font = `900 ${Math.max(16, Math.min(26, W * 0.042))}px "Courier New", Courier, monospace`;
          const textW = ctx.measureText(speechBubble.text).width;
          const bw = textW + 28;
          const bh = 42;
          const bx = Math.max(12, Math.min(W - bw - 12, speechBubble.x - bw / 2));
          const by = Math.max(12, Math.min(H - bh - 12, speechBubble.y - bh / 2));

          roundRectPath(bx, by, bw, bh, 18);
          ctx.fillStyle = "rgba(18, 24, 48, 0.9)";
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = speechBubble.color;
          ctx.stroke();

          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(speechBubble.text, bx + bw / 2, by + bh / 2 + 1);
          ctx.restore();
        }

        function drawParticles() {
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            const alpha = Math.max(0, Math.min(1, p.life / 0.5));
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            if (p.shape === "star") {
              drawStar(0, 0, p.size, p.size * 0.45, 5);
              ctx.fill();
            } else {
              ctx.beginPath();
              ctx.arc(0, 0, p.size * 0.65, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
        }

        function drawPillButton(rect, label, bgTop, bgBottom, border) {
          const pulse = reducedMotion ? 1 : 1 + Math.sin(elapsed * 3.4) * 0.03;
          const cx = rect.x + rect.w / 2;
          const cy = rect.y + rect.h / 2;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(pulse, pulse);
          ctx.translate(-cx, -cy);

          ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
          ctx.shadowBlur = 16;
          ctx.shadowOffsetY = 5;

          const g = ctx.createLinearGradient(rect.x, rect.y, rect.x, rect.y + rect.h);
          g.addColorStop(0, bgTop);
          g.addColorStop(1, bgBottom);
          roundRectPath(rect.x, rect.y, rect.w, rect.h, rect.h / 2);
          ctx.fillStyle = g;
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.lineWidth = 4;
          ctx.strokeStyle = border;
          ctx.stroke();

          ctx.fillStyle = "#111b2e";
          ctx.font = `900 ${Math.max(18, Math.min(28, rect.h * 0.44))}px "Courier New", Courier, monospace`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(label, cx, cy + 1);
          ctx.restore();
        }

        function drawTopScoreBadge() {
          if (W < 300) return;
          const pad = Math.max(12, Math.min(22, W * 0.03));
          const y = Math.max(16, Math.min(26, H * 0.035));
          ctx.save();
          // Progress stars for current round (4 cute stars, no reading required!)
          const starR = Math.max(11, Math.min(16, W * 0.025));
          const gap = starR * 2.55;
          const settledCount = roundAnimals.filter((a) => a.state === "settled").length;
          for (let i = 0; i < 4; i++) {
            const sx = pad + starR + i * gap;
            const sy = y + starR;
            drawStar(sx, sy, starR, starR * 0.46, 5);
            if (i < settledCount) {
              ctx.fillStyle = "#ffe14d";
              ctx.fill();
              ctx.strokeStyle = "#ff9f1c";
              ctx.lineWidth = 2;
              ctx.stroke();
            } else {
              ctx.fillStyle = "rgba(255, 255, 255, 0.16)";
              ctx.fill();
              ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
              ctx.lineWidth = 2;
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        function drawTitleScreen() {
          drawBackdrop();

          // Live split habitat showcase behind title so square previews look vibrant & alive!
          const pad = Math.max(10, Math.min(24, Math.min(W, H) * 0.04));
          const gap = Math.max(8, Math.min(20, W * 0.03));
          const cardW = (W - pad * 2 - gap) / 2;
          const cardH = H * 0.52;
          const cardY = H * 0.14;

          drawHabitatScene({
            id: "jungle",
            def: HABITATS.jungle,
            x: pad,
            y: cardY,
            w: cardW,
            h: cardH,
            wobbleTimer: 0,
            celebrateTimer: 0,
            hoverGlow: 0,
          });
          drawHabitatScene({
            id: "ocean",
            def: HABITATS.ocean,
            x: pad + cardW + gap,
            y: cardY,
            w: cardW,
            h: cardH,
            wobbleTimer: 0,
            celebrateTimer: 0,
            hoverGlow: 0,
          });

          // Cheerful bobbing preview animals
          const demoR = Math.max(22, Math.min(54, Math.min(cardW, cardH) * 0.28));
          const bob1 = reducedMotion ? 0 : Math.sin(elapsed * 2.4) * 6;
          const bob2 = reducedMotion ? 0 : Math.sin(elapsed * 2.4 + 1.8) * 6;

          ctx.save();
          ctx.translate(pad + cardW * 0.5, cardY + cardH * 0.66 + bob1);
          drawAnimalArtwork("lion", demoR, 0);
          ctx.restore();

          ctx.save();
          ctx.translate(pad + cardW + gap + cardW * 0.5, cardY + cardH * 0.62 + bob2);
          drawAnimalArtwork("whale", demoR, 1.5);
          ctx.restore();

          // Bright title header
          const titleSize = Math.max(20, Math.min(48, W * 0.075));
          ctx.save();
          ctx.font = `900 ${titleSize}px "Courier New", Courier, monospace`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.lineWidth = Math.max(4, titleSize * 0.16);
          ctx.strokeStyle = "#101836";
          ctx.strokeText("ANIMAL SORTER", W / 2, H * 0.08);
          ctx.fillStyle = "#ffe14d";
          ctx.fillText("ANIMAL SORTER", W / 2, H * 0.08);
          ctx.restore();

          // Play button
          drawPillButton(titlePlayBtn, "PLAY ▶", "#56f59f", "#24c975", "#ffffff");
        }

        function drawPauseOverlay() {
          ctx.save();
          ctx.fillStyle = "rgba(10, 14, 34, 0.72)";
          ctx.fillRect(0, 0, W, H);

          const titleSize = Math.max(26, Math.min(46, W * 0.07));
          ctx.font = `900 ${titleSize}px "Courier New", Courier, monospace`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#ffe14d";
          ctx.fillText("PAUSED", W / 2, H * 0.42);
          ctx.restore();

          drawPillButton(pauseResumeBtn, "PLAY ▶", "#56f59f", "#24c975", "#ffffff");
        }

        function render() {
          if (mode === "title") {
            drawTitleScreen();
            return;
          }

          drawBackdrop();
          drawTopScoreBadge();

          // Draw the two pictorial habitat blocks
          for (let i = 0; i < habitatCards.length; i++) {
            drawHabitatScene(habitatCards[i]);
          }

          // Draw bottom staging circles
          drawStagingTray();
          drawIdleHint();

          // Draw settled animals first, then tray/returning/flying, then dragged animal on top
          for (let i = 0; i < roundAnimals.length; i++) {
            const a = roundAnimals[i];
            if (a.state === "settled") drawAnimalToken(a, false, false);
          }
          for (let i = 0; i < roundAnimals.length; i++) {
            const a = roundAnimals[i];
            if (a.state !== "settled" && a.state !== "dragging") {
              drawAnimalToken(a, false, selectedAnimal === a);
            }
          }
          if (activeDrag && activeDrag.animal) {
            drawAnimalToken(activeDrag.animal, true, true);
          }

          drawParticles();
          drawSpeechBubble();

          if (mode === "roundComplete") {
            drawPillButton(nextRoundBtn, "NEXT ▶", "#ffe96b", "#ffb82e", "#ffffff");
          }

          if (mode === "paused") {
            drawPauseOverlay();
          }
        }

        // ---- Main RAF Loop ----
        let lastTime = performance.now();
        function loop(now) {
          const dt = Math.min(Math.max((now - lastTime) / 1000, 0), 0.05);
          lastTime = now;
          update(dt);
          render();
          requestAnimationFrame(loop);
        }

        // Boot
        window.addEventListener("resize", resize);
        if (typeof ResizeObserver === "function") {
          new ResizeObserver(resize).observe(canvas);
        }
        setupRound(0);
        resize();
        syncHud();
        requestAnimationFrame(loop);
      })();
    </script>
    <script src="shared/junior-guard.js" defer></script>
  </body>
</html>
