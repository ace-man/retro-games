<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Word Builder</title>
    <meta
      name="description"
      content="Toddler phonics word-building game: drag glowing letter tiles into slots to spell, sound out, and blend simple words."
    />
    <meta name="game:genre" content="Puzzle" />
    <meta name="game:tags" content="phonics, toddlers, words, touch" />
    <meta name="game:added" content="2026-11-28" />
    <meta name="game:year" content="2026" />
    <meta name="game:controls" content="Drag and drop letter tiles into the glowing slots" />
    <meta name="game:author" content="Arcade Bot" />
    <meta name="game:color" content="#ffe14d" />
    <style>
      :root {
        --target-size: 44px;
        --hud-bg: rgba(18, 11, 46, 0.82);
        --hud-border: #ffe14d;
        --hud-text: #ffffff;
        --focus-ring: #38d9ff;
      }

      @media (pointer: coarse) {
        :root {
          --target-size: 48px;
        }
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Courier New", Courier, monospace;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      main.stage {
        position: relative;
        width: 100%;
        height: 100%;
        container: stage / inline-size;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        cursor: grab;
      }

      #game.dragging {
        cursor: grabbing;
      }

      .hud-bar {
        position: fixed;
        top: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: max(10px, env(safe-area-inset-top, 0px));
        padding-right: max(10px, env(safe-area-inset-right, 0px));
        padding-left: max(10px, env(safe-area-inset-left, 0px));
        z-index: 10;
        pointer-events: none;
      }

      .hud-btn {
        pointer-events: auto;
        min-inline-size: var(--target-size);
        min-block-size: var(--target-size);
        padding: 4px 12px;
        border-radius: 14px;
        border: 2.5px solid var(--hud-border);
        background: var(--hud-bg);
        color: var(--hud-text);
        font: 900 17px/1 "Courier New", Courier, monospace;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
        transition: transform 120ms ease, border-color 120ms ease, color 120ms ease;
      }

      .hud-btn:active {
        transform: scale(0.94);
      }

      .hud-btn:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }

      .hud-btn--stage {
        border-color: #66ff66;
        color: #66ff66;
      }

      .hud-btn--next {
        border-color: #38d9ff;
        color: #38d9ff;
      }

      .hud-btn--pause {
        border-color: #ffe14d;
        color: #ffe14d;
      }

      .hud-btn[aria-pressed="true"] {
        border-color: #ff5ca8;
        color: #ff5ca8;
      }

      .hud-btn[hidden] {
        display: none;
      }

      @container stage (inline-size < 300px) {
        .hud-bar {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hud-btn {
          transition: none;
        }
      }

      .visually-hidden:where(:not(:focus-within, :active)) {
        position: absolute !important;
        clip-path: inset(50%) !important;
        overflow: hidden !important;
        width: 1px !important;
        height: 1px !important;
        margin: -1px !important;
        padding: 0 !important;
        border: 0 !important;
        white-space: nowrap !important;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <h1 class="visually-hidden">Word Builder</h1>
      <canvas id="game" aria-label="Word Builder toddler phonics puzzle game"></canvas>

      <div class="hud-bar" role="toolbar" aria-label="Game controls">
        <button
          id="btn-stage"
          class="hud-btn hud-btn--stage"
          type="button"
          aria-label="Switch phonics stage"
          hidden
        >
          <span aria-hidden="true">S1</span>
        </button>
        <button
          id="btn-next"
          class="hud-btn hud-btn--next"
          type="button"
          aria-label="Next word"
          hidden
        >
          <span aria-hidden="true">⏭</span>
        </button>
        <button
          id="btn-pause"
          class="hud-btn hud-btn--pause"
          type="button"
          aria-label="Pause game"
          aria-pressed="false"
          hidden
        >
          <span aria-hidden="true">II</span>
        </button>
        <button
          id="btn-mute"
          class="hud-btn"
          type="button"
          aria-label="Mute sound"
          aria-pressed="false"
        >
          <span aria-hidden="true">♪</span>
        </button>
      </div>

      <div id="live-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
    </main>

    <script src="audio/phonics-audio.js"></script>
    <script src="images/phonics-images.js"></script>

        // -------------------------------------------------------------------

        const LETTER_META = {

          a: { fill: "#ff5ca8", glow: "#ffa6d2", rim: "#ffe0f0", ink: "#2a081b" },

          i: { fill: "#b57bff", glow: "#ddc2ff", rim: "#f5ebff", ink: "#1c0b33" },

        };

        // -------------------------------------------------------------------
        // Custom Vector Lowercase Letterforms (Guaranteed Single-Story 'a')
        // -------------------------------------------------------------------
        function arcPts(cx, cy, rx, ry, startAng, endAng, samples) {
          const pts = [];
          for (let i = 0; i <= samples; i++) {
            const a = startAng + (i / samples) * (endAng - startAng);
            pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
          }
          return pts;
        }

        function bezierPts(p0, p1, p2, p3, samples) {
          const pts = [];
          for (let i = 0; i <= samples; i++) {
            const t = i / samples;
            const mt = 1 - t;
            pts.push([
              mt * mt * mt * p0[0] + 3 * mt * mt * t * p1[0] + 3 * mt * t * t * p2[0] + t * t * t * p3[0],
              mt * mt * mt * p0[1] + 3 * mt * mt * t * p1[1] + 3 * mt * t * t * p2[1] + t * t * t * p3[1],
            ]);
          }
          return pts;
        }

        const LETTER_PATHS = {
          s: [
            {

                ...bezierPts([0.34, -0.36], [0.22, -0.66], [-0.38, -0.66], [-0.34, -0.24], 16),
                ...bezierPts([-0.34, -0.24], [-0.30, 0.04], [0.36, 0.02], [0.36, 0.34], 16).slice(1),

          a: [

                [-0.04, 0.34],

          ],
          p: [
            { pts: [[-0.32, -0.44], [-0.32, 0.80]] },
            { pts: arcPts(0.02, -0.02, 0.37, 0.40, -0.74 * Math.PI, 0.74 * Math.PI, 32) },

          i: [
            { pts: [[0, -0.18], [0, 0.54]] },
            { dot: [0, -0.54] },
          ],
          n: [
            { pts: [[-0.34, -0.38], [-0.34, 0.54]] },
            {

                [-0.34, -0.06],

        function drawVectorLetter(ch, cx, cy, scale, strokeColor, lineWidth, outlineColor) {
          const strokes = LETTER_PATHS[ch];
          if (!strokes) return;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.lineCap = "round";
          ctx.lineJoin = "round";

          const pass = (col, lw) => {
            ctx.strokeStyle = col;
            ctx.fillStyle = col;
            ctx.lineWidth = lw;
            for (const s of strokes) {
              if (s.dot) {
                ctx.beginPath();
                ctx.arc(s.dot[0] * scale, s.dot[1] * scale, lw * 0.62, 0, Math.PI * 2);
                ctx.fill();
              } else if (s.pts && s.pts.length >= 2) {
                ctx.beginPath();
                ctx.moveTo(s.pts[0][0] * scale, s.pts[0][1] * scale);
                for (let i = 1; i < s.pts.length; i++) {
                  ctx.lineTo(s.pts[i][0] * scale, s.pts[i][1] * scale);
                }
                ctx.stroke();
              }
            }
          };

          if (outlineColor) pass(outlineColor, lineWidth + Math.max(3.5, lineWidth * 0.38));
          pass(strokeColor, lineWidth);
          ctx.restore();
        }

        function drawWordSprite(word, cx, cy, size, celebratePulse) {
          const bobY = celebratePulse && !reducedMotion ? Math.sin(elapsed * 12) * 5 : 0;
          if (window.PhonicsImages && window.PhonicsImages.draw(ctx, word, cx, cy + bobY, size)) {
            return;
          }
          const sprite = WORD_SPRITES[word];
          if (!sprite) return;
          const n = sprite.rows.length;
          const cell = size / n;
          const x0 = cx - size / 2;
          const y0 = cy - size / 2 + bobY;
          for (let r = 0; r < n; r++) {
            const row = sprite.rows[r];
            for (let c = 0; c < row.length; c++) {
              const ch = row[c];
              if (ch === ".") continue;
              const col = sprite.palette[ch];
              if (!col) continue;
              ctx.fillStyle = col;
              ctx.fillRect(Math.floor(x0 + c * cell), Math.floor(y0 + r * cell), Math.ceil(cell), Math.ceil(cell));
            }
          }
        }

        // -------------------------------------------------------------------
        // Persistence
        // -------------------------------------------------------------------
        function loadStage() {
          try {
            return parseInt(localStorage.getItem(STORAGE_STAGE), 10) === 2 ? 2 : 1;
          } catch (_) {
            return 1;
          }
        }

        function saveStage(stageId) {
          try {
            localStorage.setItem(STORAGE_STAGE, String(stageId));
          } catch (_) {}
        }

        function loadWordsCount() {
          try {
            const n = parseInt(localStorage.getItem(STORAGE_WORDS), 10);
            return Number.isFinite(n) && n > 0 ? n : 0;
          } catch (_) {
            return 0;
          }
        }

        function saveWordsCount(val) {
          try {
            localStorage.setItem(STORAGE_WORDS, String(val));
          } catch (_) {}
        }

        // -------------------------------------------------------------------

        // -------------------------------------------------------------------
        let audioCtx = null;
        let hasUserGesture = false;
        let preloaded = false;
        let muted = false;
        let speakerPulse = 0;
        let activeTimers = [];

        function ensureAudio() {
          hasUserGesture = true;
          if (!audioCtx) {
            const AudioCtor = window.AudioContext || window.webkitAudioContext;
            if (AudioCtor) {
              try {
                audioCtx = new AudioCtor();
              } catch (_) {
                audioCtx = null;
              }
            }
          }
          if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume().catch(() => {});
          }
          if (window.PhonicsAudio) {
            window.PhonicsAudio.unlock(audioCtx);
            window.PhonicsAudio.setMuted(muted);
            if (!preloaded) {
              preloaded = true;
              const allWords = STAGES[1].words.concat(STAGES[2].words);
              window.PhonicsAudio.preload(window.PhonicsAudio.LETTER_LIST, allWords);
            }
          }
        }

        function clearScheduledTimers() {
          activeTimers.forEach((id) => clearTimeout(id));
          activeTimers = [];
        }

        function schedule(fn, ms) {
          const id = setTimeout(() => {
            activeTimers = activeTimers.filter((t) => t !== id);
            fn();
          }, ms);
          activeTimers.push(id);
        }

        function cancelSpeech() {
          if (window.PhonicsAudio) {
            window.PhonicsAudio.stop();
          }
        }

        function playTone(f0, f1, dur, type, vol, delay) {
          if (muted || !hasUserGesture || !audioCtx) return;
          const t0 = audioCtx.currentTime + (delay || 0);
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = type || "sine";
          osc.frequency.setValueAtTime(f0, t0);
          if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.linearRampToValueAtTime(vol || 0.14, t0 + Math.min(0.018, dur * 0.25));
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(g);
          g.connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.02);
        }

        function playPickupPop() {
          playTone(380, 620, 0.08, "sine", 0.13, 0);
        }

        function playSnapChime() {
          playTone(523.25, 659.25, 0.11, "triangle", 0.14, 0);
          playTone(783.99, 783.99, 0.14, "sine", 0.11, 0.06);
        }

        function playSoftBoing() {
          playTone(280, 210, 0.11, "sine", 0.12, 0);
          playTone(210, 270, 0.12, "triangle", 0.1, 0.09);
        }

        function playBlendFanfare() {
          const notes = [392.0, 523.25, 659.25, 783.99, 1046.5];
          notes.forEach((f, i) => {
            playTone(f, f, i === notes.length - 1 ? 0.36 : 0.12, "triangle", 0.11, i * 0.085);
          });
        }

        function speakPhonic(ch, opts) {
          if (muted || !hasUserGesture) {
            if (opts && typeof opts.onEnded === "function") opts.onEnded();
            return;
          }
          if (!LETTER_META[ch]) return;
          if (window.PhonicsAudio) {
            window.PhonicsAudio.playLetter(ch, opts);
          } else if (opts && typeof opts.onEnded === "function") {
            opts.onEnded();
          }
        }

        function speakWord(word, opts) {
          if (muted || !hasUserGesture) {
            if (opts && typeof opts.onEnded === "function") opts.onEnded();
            return;
          }
          speakerPulse = 1.0;
          if (window.PhonicsAudio) {
            window.PhonicsAudio.playWord(word, opts);
          } else {
            playSnapChime();
            if (opts && typeof opts.onEnded === "function") opts.onEnded();
          }
        }

        function announce(text) {
          if (!liveStatus) return;
          liveStatus.textContent = "";
          requestAnimationFrame(() => {
            liveStatus.textContent = text;
          });
        }

        // -------------------------------------------------------------------
        // Game State
        // -------------------------------------------------------------------
        let W = 320;
        let H = 320;
        let dpr = 1;

        // "title" | "playing" | "blending" | "paused"
        let state = "title";
        let stateBeforePause = "playing";
        let activeStage = loadStage();
        let wordsBuilt = loadWordsCount();
        let wordIdx = 0;
        let currentWord = "tap";
        let elapsed = 0;

        // Layout zones
        let pictureRect = { x: 0, y: 0, w: 120, h: 120 };
        let speakerBtn = { cx: 0, cy: 0, r: 30 };
        let trayRect = { x: 0, y: 0, w: 280, h: 100 };
        let stage1Rect = { x: 0, y: 0, w: 0, h: 0 };
        let stage2Rect = { x: 0, y: 0, w: 0, h: 0 };

        let pictureBounce = 0;
        let slots = []; // [{ idx, expected, x, y, size, filledTileId, magnetGlow, blendPulse }]
        let tiles = []; // [{ id, char, homeX, homeY, x, y, size, placedSlot, returning, bounceScale, wobbleTimer }]

        // Active drag & tap-select state (single pointerId enforced!)
        let activeDrag = null; // { tile, pointerId, pointerType, startX, startY, moved, liftY }
        let selectedTileId = null;

        // Word blending celebration state
        let blendHighlightIdx = -1;
        let beamProgress = -1; // 0..1 when sweeping beam across word
        let beamActive = false;

        // Visual FX
        let starsBg = [];
        let particles = [];
        let rings = [];

        function shuffle(arr) {
          const a = arr.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        }

        function initStars() {
          starsBg = [];
          for (let i = 0; i < 42; i++) {
            starsBg.push({
              x: Math.random(),
              y: Math.random(),
              r: 1 + Math.random() * 2.2,
              phase: Math.random() * Math.PI * 2,
              speed: 1.1 + Math.random() * 2.0,
            });
          }
        }

        function computeLayout() {
          const compact = W < 300;
          const isLandscape = W > H * 1.15;
          const pad = Math.max(12, Math.min(24, Math.min(W, H) * 0.03));
          const topBar = compact ? pad : Math.max(58, Math.min(72, H * 0.1));

          const availH = Math.max(160, H - topBar - pad);

          // Picture frame size
          const picSize = Math.max(
            74,
            Math.min(isLandscape ? availH * 0.38 : availH * 0.34, Math.min(W * 0.42, 196))
          );
          const picY = topBar + (isLandscape ? 4 : Math.max(6, availH * 0.02));
          pictureRect = { x: W / 2 - picSize / 2, y: picY, w: picSize, h: picSize };

          // Big Speaker / Hear Again button right beside the picture frame
          const spkR = Math.max(26, Math.min(38, Math.min(W, H) * 0.068));
          const spkX = Math.min(W - pad - spkR, pictureRect.x + pictureRect.w + Math.max(16, spkR * 0.7) + spkR);
          speakerBtn = { cx: spkX, cy: pictureRect.y + pictureRect.h / 2, r: spkR };

          // Slots row in middle
          const slotCount = Math.max(2, currentWord.length);
          const slotGap = Math.max(12, Math.min(26, W * 0.035));
          const maxSlotW = (W - pad * 2 - slotGap * (slotCount - 1)) / slotCount;
          const slotSize = Math.max(58, Math.min(114, maxSlotW, availH * 0.26));
          const slotsTotalW = slotCount * slotSize + (slotCount - 1) * slotGap;
          const slotsStartX = W / 2 - slotsTotalW / 2;
          const slotsY = pictureRect.y + pictureRect.h + Math.max(16, availH * 0.06);

          slots.forEach((sl, idx) => {
            sl.x = slotsStartX + idx * (slotSize + slotGap);
            sl.y = slotsY;
            sl.size = slotSize;
          });

          // Bottom tray for draggable letter tiles
          const trayTop = slotsY + slotSize + Math.max(18, availH * 0.07);
          const trayH = Math.max(82, H - trayTop - pad);
          trayRect = { x: pad, y: trayTop, w: W - pad * 2, h: trayH };

          // Position tiles nicely across tray
          const tileCount = Math.max(1, tiles.length);
          const tileGap = Math.max(10, Math.min(22, trayRect.w * 0.025));
          const maxTileW = (trayRect.w - 20 - tileGap * (tileCount - 1)) / tileCount;
          const tileSize = Math.max(54, Math.min(slotSize * 0.96, maxTileW, trayRect.h * 0.8));
          const rowW = tileCount * tileSize + (tileCount - 1) * tileGap;
          const startX = W / 2 - rowW / 2;
          const tileCy = trayRect.y + trayRect.h / 2;

          tiles.forEach((t, idx) => {
            t.size = tileSize;
            t.homeX = startX + idx * (tileSize + tileGap) + tileSize / 2;
            t.homeY = tileCy;
            if (t.placedSlot !== null) {
              const sl = slots[t.placedSlot];
              if (sl) {
                t.x = sl.x + sl.size / 2;
                t.y = sl.y + sl.size / 2;
              }
            } else if (!activeDrag || activeDrag.tile !== t) {
              t.x = t.homeX;
              t.y = t.homeY;
            }
          });
        }

        function resize() {
          const rect = canvas.getBoundingClientRect();
          W = Math.max(1, rect.width);
          H = Math.max(1, rect.height);
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(W * dpr);
          canvas.height = Math.floor(H * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          computeLayout();
        }

        function syncHud() {
          const inPlay = state !== "title";
          btnStage.hidden = !inPlay;
          btnNext.hidden = !inPlay;
          btnPause.hidden = !inPlay;

          btnStage.firstElementChild.textContent = activeStage === 1 ? "S1" : "S2";
          btnStage.setAttribute(
            "aria-label",
            activeStage === 1 ? "Stage 1 active (s a t p). Tap for Stage 2" : "Stage 2 active (s a t p i n). Tap for Stage 1"
          );

          btnPause.setAttribute("aria-pressed", String(state === "paused"));
          btnPause.setAttribute("aria-label", state === "paused" ? "Resume game" : "Pause game");
          btnPause.firstElementChild.textContent = state === "paused" ? "▶" : "II";

          btnMute.setAttribute("aria-pressed", String(muted));
          btnMute.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
          btnMute.firstElementChild.textContent = muted ? "✕" : "♪";
        }

        // -------------------------------------------------------------------
        // Word Setup & Blending Sequence
        // -------------------------------------------------------------------
        function loadWord(idx, speakPrompt) {
          clearScheduledTimers();
          cancelSpeech();
          const pool = STAGES[activeStage].words;
          wordIdx = ((idx % pool.length) + pool.length) % pool.length;
          currentWord = pool[wordIdx];
          state = "playing";
          activeDrag = null;
          selectedTileId = null;
          canvas.classList.remove("dragging");
          blendHighlightIdx = -1;
          beamProgress = -1;
          beamActive = false;
          pictureBounce = 1;

          slots = currentWord.split("").map((ch, i) => ({
            idx: i,
            expected: ch,
            x: 0,
            y: 0,
            size: 80,
            filledTileId: null,
            magnetGlow: 0,
            blendPulse: 0,
          }));

          // Build tile tray: target word's letters + 1-2 gentle distractors from active stage
          const stageLetters = STAGES[activeStage].letters;
          const wordSet = new Set(currentWord.split(""));
          const nonWordDistractors = shuffle(stageLetters.filter((l) => !wordSet.has(l)));
          const extraCount = currentWord.length <= 2 ? 2 : W < 360 ? 1 : 2;
          const trayChars = currentWord.split("");
          for (let i = 0; i < extraCount; i++) {
            const d = nonWordDistractors[i] || stageLetters[i % stageLetters.length];
            trayChars.push(d);
          }

          // Shuffle until tray order doesn't trivially match word in exact left-to-right order
          let shuffled = shuffle(trayChars);
          if (shuffled.slice(0, currentWord.length).join("") === currentWord) {
            shuffled = shuffle(trayChars);
          }

          tiles = shuffled.map((ch, i) => ({
            id: i,
            char: ch,
            homeX: 0,
            homeY: 0,
            x: 0,
            y: 0,
            size: 72,
            placedSlot: null,
            returning: false,
            bounceScale: 1,
            wobbleTimer: 0,
          }));

          computeLayout();
          syncHud();
          announce(`Build the word ${currentWord}`);

          if (speakPrompt) {
            schedule(() => {
              if (state === "playing") speakWord(currentWord);
            }, 220);
          }
        }

        function startGame() {
          ensureAudio();
          [261.63, 329.63, 392.0, 523.25].forEach((f, i) => {
            playTone(f, f, 0.12, "triangle", 0.13, i * 0.055);
          });
          loadWord(0, true);
        }

        function setStage(stageId) {
          activeStage = stageId === 2 ? 2 : 1;
          saveStage(activeStage);
          wordIdx = 0;
          if (state !== "title") {
            loadWord(0, true);
          }
          syncHud();
        }

        function spawnSparkles(x, y, color, count) {
          const n = reducedMotion ? Math.min(4, count) : count;
          for (let i = 0; i < n; i++) {
            const a = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.3;
            const spd = 45 + Math.random() * 140;
            particles.push({
              x,
              y,
              vx: Math.cos(a) * spd,
              vy: Math.sin(a) * spd - 20,
              size: 4.5 + Math.random() * 6,
              color: i % 3 === 0 ? "#ffffff" : i % 2 === 0 ? color : "#ffe14d",
              life: 0.55 + Math.random() * 0.4,
              maxLife: 0.95,
              star: i % 2 === 0,
            });
          }
        }

        function placeTileInSlot(tile, slot) {
          tile.placedSlot = slot.idx;
          tile.returning = false;
          tile.x = slot.x + slot.size / 2;
          tile.y = slot.y + slot.size / 2;
          tile.bounceScale = 1.24;
          slot.filledTileId = tile.id;
          selectedTileId = null;

          const meta = LETTER_META[tile.char];
          rings.push({ x: tile.x, y: tile.y, r: tile.size * 0.35, maxR: tile.size * 1.15, alpha: 1, color: meta.rim });
          spawnSparkles(tile.x, tile.y, meta.fill, 14);
          playSnapChime();

          // Check if all slots are filled!
          if (slots.every((s) => s.filledTileId !== null)) {
            startWordBlendingCelebration();
          } else {
            // Replay crisp phonic sound cleanly when snapped in
            schedule(() => {
              if (state === "playing") speakPhonic(tile.char);
            }, 90);
          }
        }

        function startWordBlendingCelebration() {
          state = "blending";
          activeDrag = null;
          selectedTileId = null;
          canvas.classList.remove("dragging");
          wordsBuilt += 1;
          saveWordsCount(wordsBuilt);

          const letters = currentWord.split("");

          const playSweepAndWord = () => {
            if (state !== "blending") return;
            blendHighlightIdx = -1;
            beamActive = true;
            beamProgress = 0;
            pictureBounce = 1.0;
            speakWord(currentWord);
            playBlendFanfare();

            // Celebration sparkles across the illustration & word
            spawnSparkles(pictureRect.x + pictureRect.w / 2, pictureRect.y + pictureRect.h / 2, "#ffe14d", 26);
            slots.forEach((sl) => {
              sl.blendPulse = 1.0;
              spawnSparkles(sl.x + sl.size / 2, sl.y + sl.size / 2, "#38d9ff", 10);
            });
            announce(`Hooray! ${currentWord}!`);

            // Smoothly advance to the next word
            schedule(() => {
              if (state === "blending") {
                loadWord(wordIdx + 1, true);
              }
            }, 2050);
          };

          // Step 1: Highlight each tile sequentially left-to-right & play its pure British phonic sound
          const playLetterStep = (idx) => {
            if (state !== "blending") return;
            if (idx >= letters.length) {
              schedule(playSweepAndWord, 190);
              return;
            }
            const ch = letters[idx];
            blendHighlightIdx = idx;
            const sl = slots[idx];
            if (sl) {
              sl.blendPulse = 1.0;
              const cx = sl.x + sl.size / 2;
              const cy = sl.y + sl.size / 2;
              spawnSparkles(cx, cy, LETTER_META[ch].fill, 12);
              rings.push({ x: cx, y: cy, r: sl.size * 0.35, maxR: sl.size * 1.1, alpha: 1, color: "#ffe14d" });
            }
            const startedAt = performance.now();
            let advanced = false;
            const goNext = () => {
              if (advanced || state !== "blending") return;
              advanced = true;
              const elapsedMs = performance.now() - startedAt;
              const delay = Math.max(150, 380 - elapsedMs);
              schedule(() => playLetterStep(idx + 1), delay);
            };
            speakPhonic(ch, { onEnded: goNext });
            // Safety timer in case an audio clip fails to fire onended
            schedule(goNext, 1100);
          };

          schedule(() => playLetterStep(0), 260);
        }

        // -------------------------------------------------------------------
        // Pointer Input (Single Active Pointer + Lift Offset + Tap Fallback)
        // -------------------------------------------------------------------
        function inRect(x, y, r, pad) {
          const p = pad || 0;
          return x >= r.x - p && x <= r.x + r.w + p && y >= r.y - p && y <= r.y + r.h + p;
        }

        function inCircle(x, y, c, mult) {
          const rr = c.r * (mult || 1.25);
          const dx = x - c.cx;
          const dy = y - c.cy;
          return dx * dx + dy * dy <= rr * rr;
        }

        function findNearestMatchingSlot(tile, tx, ty) {
          let best = null;
          let bestDist = Infinity;
          for (const sl of slots) {
            if (sl.filledTileId !== null) continue;
            const scx = sl.x + sl.size / 2;
            const scy = sl.y + sl.size / 2;
            const hitR = sl.size * 0.92; // generous magnetic drop zone
            const d = Math.hypot(tx - scx, ty - scy);
            if (d <= hitR && d < bestDist) {
              bestDist = d;
              best = sl;
            }
          }
          return best;
        }

        function handlePointerDown(e) {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          e.preventDefault();
          ensureAudio();

          if (activeDrag && activeDrag.pointerId !== e.pointerId) return;

          const rect = canvas.getBoundingClientRect();
          const px = e.clientX - rect.left;
          const py = e.clientY - rect.top;

          if (state === "title") {
            if (inRect(px, py, stage1Rect, 6)) {
              playTone(440, 520, 0.09, "triangle", 0.14, 0);
              setStage(1);
              return;
            }
            if (inRect(px, py, stage2Rect, 6)) {
              playTone(523.25, 659.25, 0.09, "triangle", 0.14, 0);
              setStage(2);
              return;
            }
            startGame();
            return;
          }

          if (state === "paused") {
            state = stateBeforePause === "paused" ? "playing" : stateBeforePause;
            syncHud();
            if (state === "playing") speakWord(currentWord);
            return;
          }

          // Tap picture frame OR Speaker button -> speak target word clearly
          if (inRect(px, py, pictureRect, 8) || inCircle(px, py, speakerBtn, 1.25)) {
            pictureBounce = 1.0;
            speakWord(currentWord);
            return;
          }

          if (state !== "playing") return;

          // Check draggable tray tiles (generous hitbox)
          for (let i = tiles.length - 1; i >= 0; i--) {
            const t = tiles[i];
            if (t.placedSlot !== null) continue;
            const half = t.size * 0.64;
            if (px >= t.x - half && px <= t.x + half && py >= t.y - half && py <= t.y + half) {
              const liftY = e.pointerType === "touch" ? Math.max(46, t.size * 0.68) : Math.max(16, t.size * 0.22);
              activeDrag = {
                tile: t,
                pointerId: e.pointerId,
                pointerType: e.pointerType,
                startX: px,
                startY: py,
                moved: false,
                liftY,
              };
              t.returning = false;
              t.x = px;
              t.y = Math.max(t.size * 0.55, py - liftY);
              selectedTileId = t.id;
              canvas.classList.add("dragging");
              try {
                canvas.setPointerCapture(e.pointerId);
              } catch (_) {}

              playPickupPop();
              speakPhonic(t.char);
              return;
            }
          }

          // Single-pointer tap-to-place fallback: if a tile is selected and user taps an empty slot
          if (selectedTileId !== null) {
            const selTile = tiles.find((t) => t.id === selectedTileId && t.placedSlot === null);
            if (selTile) {
              for (const sl of slots) {
                if (sl.filledTileId !== null) continue;
                if (inRect(px, py, { x: sl.x, y: sl.y, w: sl.size, h: sl.size }, 14)) {
                  if (sl.expected === selTile.char) {
                    placeTileInSlot(selTile, sl);
                  } else {
                    selTile.wobbleTimer = 0.45;
                    playSoftBoing();
                    selectedTileId = null;
                  }
                  return;
                }
              }
            }
          }
        }

        function handlePointerMove(e) {
          if (!activeDrag || activeDrag.pointerId !== e.pointerId) return;
          if (state !== "playing") return;
          e.preventDefault();
          const rect = canvas.getBoundingClientRect();
          const px = e.clientX - rect.left;
          const py = e.clientY - rect.top;

          if (Math.hypot(px - activeDrag.startX, py - activeDrag.startY) > 6) {
            activeDrag.moved = true;
          }

          const t = activeDrag.tile;
          t.x = Math.max(t.size * 0.5, Math.min(W - t.size * 0.5, px));
          t.y = Math.max(t.size * 0.5, Math.min(H - t.size * 0.5, py - activeDrag.liftY));

          // Update magnetic highlight on matching slot
          const nearSlot = findNearestMatchingSlot(t, t.x, t.y);
          for (const sl of slots) {
            sl.magnetGlow = nearSlot === sl && sl.expected === t.char ? 1 : 0;
          }
        }

        function finishDrag(e) {
          if (!activeDrag || activeDrag.pointerId !== e.pointerId) return;
          const { tile, moved } = activeDrag;
          activeDrag = null;
          canvas.classList.remove("dragging");

          for (const sl of slots) sl.magnetGlow = 0;

          if (state !== "playing") {
            tile.returning = true;
            return;
          }

          const nearSlot = findNearestMatchingSlot(tile, tile.x, tile.y);
          if (nearSlot) {
            if (nearSlot.expected === tile.char) {
              placeTileInSlot(tile, nearSlot);
              return;
            } else {
              // Wrong slot: gently bounce back to tray with soft boing, zero penalty!
              tile.returning = true;
              tile.wobbleTimer = 0.42;
              selectedTileId = null;
              playSoftBoing();
              return;
            }
          }

          // If dropped elsewhere (or just tapped), glide gently back to tray
          tile.returning = true;
          if (moved) {
            selectedTileId = null;
          }
        }

        function pauseIfActive() {
          if (state === "playing" || state === "blending") {
            stateBeforePause = state;
            state = "paused";
            activeDrag = null;
            canvas.classList.remove("dragging");
            clearScheduledTimers();
            cancelSpeech();
            syncHud();
          }
        }

        btnStage.addEventListener("click", (e) => {
          e.stopPropagation();
          ensureAudio();
          playTone(440, 587.33, 0.1, "triangle", 0.14, 0);
          setStage(activeStage === 1 ? 2 : 1);
        });

        btnNext.addEventListener("click", (e) => {
          e.stopPropagation();
          ensureAudio();
          playTone(440, 523.25, 0.08, "triangle", 0.12, 0);
          loadWord(wordIdx + 1, true);
        });

        btnPause.addEventListener("click", (e) => {
          e.stopPropagation();
          ensureAudio();
          if (state === "paused") {
            if (stateBeforePause === "blending") {
              loadWord(wordIdx + 1, true);
            } else {
              state = "playing";
              syncHud();
              speakWord(currentWord);
            }
          } else {
            pauseIfActive();
          }
        });

        btnMute.addEventListener("click", (e) => {
          e.stopPropagation();
          ensureAudio();
          muted = !muted;
          if (window.PhonicsAudio) window.PhonicsAudio.setMuted(muted);
          if (muted) cancelSpeech();
          syncHud();
        });

        canvas.addEventListener("pointerdown", handlePointerDown);
        canvas.addEventListener("pointermove", handlePointerMove);
        canvas.addEventListener("pointerup", finishDrag);
        canvas.addEventListener("pointercancel", finishDrag);
        canvas.addEventListener("lostpointercapture", finishDrag);

        window.addEventListener("blur", pauseIfActive);
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) pauseIfActive();
        });
        window.addEventListener("resize", resize);

        // -------------------------------------------------------------------
        // Update Loop
        // -------------------------------------------------------------------
        function update(dt) {
          elapsed += dt;
          if (speakerPulse > 0) speakerPulse = Math.max(0, speakerPulse - dt * 1.9);
          if (pictureBounce > 0) pictureBounce = Math.max(0, pictureBounce - dt * 2.4);

          if (beamActive) {
            beamProgress += dt * 1.85;
            if (beamProgress >= 1.25) {
              beamActive = false;
            }
          }

          for (const sl of slots) {
            if (sl.blendPulse > 0) sl.blendPulse = Math.max(0, sl.blendPulse - dt * 1.8);
          }

          for (const t of tiles) {
            if (t.wobbleTimer > 0) t.wobbleTimer = Math.max(0, t.wobbleTimer - dt);
            if (t.bounceScale > 1) t.bounceScale = Math.max(1, t.bounceScale - dt * 2.2);

            if (t.returning && t.placedSlot === null) {
              const lerp = Math.min(1, dt * 14);
              t.x += (t.homeX - t.x) * lerp;
              t.y += (t.homeY - t.y) * lerp;
              if (Math.hypot(t.homeX - t.x, t.homeY - t.y) < 1.2) {
                t.x = t.homeX;
                t.y = t.homeY;
                t.returning = false;
              }
            }
          }

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 150 * dt;
            p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
          }
          for (let i = rings.length - 1; i >= 0; i--) {
            const rg = rings[i];
            rg.r += (rg.maxR - rg.r) * Math.min(1, dt * 10);
            rg.alpha -= dt * 2.1;
            if (rg.alpha <= 0) rings.splice(i, 1);
          }
        }

        // -------------------------------------------------------------------
        // Rendering
        // -------------------------------------------------------------------
        function drawRoundedBox(x, y, w, h, r, fill, stroke, lw, dashed) {
          const rr = Math.min(r, w / 2, h / 2);
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(x + rr, y);
          ctx.lineTo(x + w - rr, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
          ctx.lineTo(x + w, y + h - rr);
          ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
          ctx.lineTo(x + rr, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
          ctx.lineTo(x, y + rr);
          ctx.quadraticCurveTo(x, y, x + rr, y);
          ctx.closePath();
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fill();
          }
          if (stroke) {
            if (dashed) ctx.setLineDash(dashed);
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lw || 2.5;
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawStar(x, y, size, color) {
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
            const a2 = a1 + Math.PI / 5;
            const rx = x + Math.cos(a1) * size;
            const ry = y + Math.sin(a1) * size;
            const ix = x + Math.cos(a2) * (size * 0.45);
            const iy = y + Math.sin(a2) * (size * 0.45);
            if (i === 0) ctx.moveTo(rx, ry);
            else ctx.lineTo(rx, ry);
            ctx.lineTo(ix, iy);
          }
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();
        }

        function drawBackground() {
          const grad = ctx.createLinearGradient(0, 0, 0, H);
          grad.addColorStop(0, "#120b2e");
          grad.addColorStop(0.55, "#1d1b52");
          grad.addColorStop(1, "#123466");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);

          for (const s of starsBg) {
            const tw = reducedMotion ? 0.5 : 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(elapsed * s.speed + s.phase));
            ctx.fillStyle = `rgba(255, 255, 255, ${tw.toFixed(2)})`;
            ctx.fillRect(Math.floor(s.x * W), Math.floor(s.y * H), Math.ceil(s.r), Math.ceil(s.r));
          }

          ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
          for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
        }

        function drawTopHudBadge() {
          if (W < 300) return;
          const pad = Math.max(12, Math.min(20, W * 0.03));
          const pool = STAGES[activeStage].words;
          ctx.save();
          drawRoundedBox(pad, pad, 142, 42, 14, "rgba(18, 11, 46, 0.82)", "#ffe14d", 2.5);
          ctx.font = `900 15px "Courier New", Courier, monospace`;
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#ffe14d";
          ctx.fillText(`★ ${wordsBuilt}  ${wordIdx + 1}/${pool.length}`, pad + 14, pad + 21);
          ctx.restore();
        }

        function drawPictureFrame() {
          const sprite = WORD_SPRITES[currentWord];
          const cx = pictureRect.x + pictureRect.w / 2;
          const cy = pictureRect.y + pictureRect.h / 2;
          const bounce = 1 + (pictureBounce > 0 ? Math.sin(pictureBounce * Math.PI) * 0.09 : 0);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(bounce, bounce);
          ctx.shadowColor = (sprite && sprite.accent) || "#ffe14d";
          ctx.shadowBlur = state === "blending" ? 26 : 14;
          drawRoundedBox(
            -pictureRect.w / 2,
            -pictureRect.h / 2,
            pictureRect.w,
            pictureRect.h,
            24,
            (sprite && sprite.bg) || "#1a1848",
            state === "blending" ? "#ffe14d" : (sprite && sprite.accent) || "#38d9ff",
            4.5
          );
          ctx.shadowBlur = 0;
          drawWordSprite(currentWord, 0, 0, pictureRect.w * 0.82, state === "blending");
          ctx.restore();
        }

        function drawSpeakerButton() {
          if (W < 300) return;
          const { cx, cy, r } = speakerBtn;
          const p = speakerPulse > 0 ? Math.sin(speakerPulse * Math.PI) * 0.12 : Math.sin(elapsed * 2.5) * 0.025;
          const rr = r * (1 + p);

          ctx.save();
          if (speakerPulse > 0) {
            ctx.globalAlpha = speakerPulse * 0.75;
            ctx.strokeStyle = "#38d9ff";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(cx, cy, r * (1.05 + (1 - speakerPulse) * 0.8), 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }

          const grad = ctx.createRadialGradient(cx - rr * 0.25, cy - rr * 0.25, 4, cx, cy, rr);
          grad.addColorStop(0, "#5be8ff");
          grad.addColorStop(1, "#1e6ef0");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(cx, cy, rr, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = "#ffe14d";
          ctx.stroke();

          const s = rr * 0.42;
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.moveTo(cx - s * 0.95, cy - s * 0.38);
          ctx.lineTo(cx - s * 0.35, cy - s * 0.38);
          ctx.lineTo(cx + s * 0.22, cy - s * 0.86);
          ctx.lineTo(cx + s * 0.22, cy + s * 0.86);
          ctx.lineTo(cx - s * 0.35, cy + s * 0.38);
          ctx.lineTo(cx - s * 0.95, cy + s * 0.38);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = "#ffe14d";
          ctx.lineWidth = Math.max(2.5, rr * 0.085);
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.arc(cx + s * 0.26, cy, s * 0.48, -0.35 * Math.PI, 0.35 * Math.PI);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx + s * 0.26, cy, s * 0.82, -0.38 * Math.PI, 0.38 * Math.PI);
          ctx.stroke();
          ctx.restore();
        }

        function drawSlots() {
          // Find leftmost empty slot for subtle visual hint pulse
          const firstEmptyIdx = slots.findIndex((s) => s.filledTileId === null);

          for (const sl of slots) {
            const isFilled = sl.filledTileId !== null;
            const isHint = !isFilled && sl.idx === firstEmptyIdx;
            const isMag = sl.magnetGlow > 0;
            const isBlendLit = blendHighlightIdx === sl.idx || sl.blendPulse > 0;
            const pulse = isHint && !reducedMotion ? 1 + Math.sin(elapsed * 4.5) * 0.035 : 1;

            ctx.save();
            const cx = sl.x + sl.size / 2;
            const cy = sl.y + sl.size / 2;
            ctx.translate(cx, cy);
            ctx.scale(pulse, pulse);

            if (isMag || isBlendLit) {
              ctx.shadowColor = isMag ? LETTER_META[sl.expected].fill : "#ffe14d";
              ctx.shadowBlur = 24;
            }

            drawRoundedBox(
              -sl.size / 2,
              -sl.size / 2,
              sl.size,
              sl.size,
              18,
              isMag
                ? "rgba(255, 225, 77, 0.24)"
                : isFilled
                  ? "rgba(24, 18, 60, 0.72)"
                  : "rgba(18, 11, 46, 0.74)",
              isMag
                ? LETTER_META[sl.expected].fill
                : isHint
                  ? "#ffe14d"
                  : isFilled
                    ? "#66ff66"
                    : "rgba(153, 238, 255, 0.55)",
              isMag || isHint ? 4 : 3,
              isFilled ? null : [8, 7]
            );
            ctx.restore();
          }

          // Glowing arcade beam sweep across the whole word during blending!
          if (beamActive && slots.length >= 2) {
            const first = slots[0];
            const last = slots[slots.length - 1];
            const x1 = first.x - 12;
            const x2 = last.x + last.size + 12;
            const cy = first.y + first.size / 2;
            const beamX = x1 + Math.min(1, beamProgress) * (x2 - x1);

            ctx.save();
            const grad = ctx.createLinearGradient(x1, cy, beamX, cy);
            grad.addColorStop(0, "rgba(56, 217, 255, 0.15)");
            grad.addColorStop(0.75, "rgba(255, 225, 77, 0.85)");
            grad.addColorStop(1, "#ffffff");
            ctx.strokeStyle = grad;
            ctx.lineWidth = Math.max(10, first.size * 0.22);
            ctx.lineCap = "round";
            ctx.shadowColor = "#ffe14d";
            ctx.shadowBlur = 26;
            ctx.beginPath();
            ctx.moveTo(x1, cy);
            ctx.lineTo(beamX, cy);
            ctx.stroke();

            drawStar(beamX, cy, Math.max(14, first.size * 0.24), "#ffffff");
            ctx.restore();
          }
        }

        function drawTray() {
          drawRoundedBox(
            trayRect.x,
            trayRect.y,
            trayRect.w,
            trayRect.h,
            22,
            "rgba(14, 9, 38, 0.65)",
            "rgba(153, 238, 255, 0.32)",
            2.5
          );
        }

        function drawTile(t, isDragged) {
          const meta = LETTER_META[t.char];
          const isSelected = selectedTileId === t.id && t.placedSlot === null;
          const slot = t.placedSlot !== null ? slots[t.placedSlot] : null;
          const isBlendLit = slot && (blendHighlightIdx === slot.idx || slot.blendPulse > 0);
          const wobX = t.wobbleTimer > 0 ? Math.sin(t.wobbleTimer * 44) * 9 * (t.wobbleTimer / 0.45) : 0;

          let sc = t.bounceScale;
          if (isDragged) sc = 1.18;
          else if (isBlendLit) sc = 1.16 + (slot.blendPulse || 0) * 0.1;
          else if (isSelected) sc = 1.08;

          const s = slot ? slot.size * 0.92 : t.size;

          ctx.save();
          ctx.translate(t.x + wobX, t.y);
          ctx.scale(sc, sc);

          // Drop shadow under dragged tile
          if (isDragged) {
            ctx.shadowColor = "rgba(0, 0, 0, 0.55)";
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 12;
          } else if (isBlendLit || isSelected) {
            ctx.shadowColor = isBlendLit ? "#ffe14d" : meta.fill;
            ctx.shadowBlur = 22;
          }

          // Chunky glossy retro tile body
          const grad = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
          grad.addColorStop(0, meta.glow);
          grad.addColorStop(0.55, meta.fill);
          grad.addColorStop(1, meta.fill);
          drawRoundedBox(-s / 2, -s / 2, s, s, 16, grad, isBlendLit || isDragged ? "#ffffff" : meta.rim, isDragged || isBlendLit ? 4 : 3);

          // Inner glossy highlight strip
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;
          ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
          drawRoundedBox(-s * 0.4, -s * 0.42, s * 0.8, s * 0.22, 8, "rgba(255, 255, 255, 0.28)", null);

          // Custom single-story lowercase vector letter
          drawVectorLetter(t.char, 0, s * 0.02, s * 0.42, "#ffffff", Math.max(5, s * 0.115), meta.ink);

          ctx.restore();
        }

        function drawEffects() {
          for (const rg of rings) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, rg.alpha);
            ctx.strokeStyle = rg.color;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
          for (const p of particles) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
            if (p.star) drawStar(p.x, p.y, p.size, p.color);
            else {
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * 0.55, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
        }

        function drawTitleOverlay() {
          const minDim = Math.min(W, H);
          const compact = W < 300;
          const cx = W / 2;
          const cy = H / 2;

          // Attract mode preview: animated pixel art + glowing s-a-t tiles
          const demoWords = STAGES[activeStage].words;
          const demoWord = demoWords[Math.floor(elapsed / 2.6) % demoWords.length];
          const demoSpriteSize = Math.max(66, Math.min(130, minDim * 0.28));
          ctx.save();
          ctx.globalAlpha = 0.55;
          drawRoundedBox(
            cx - demoSpriteSize / 2,
            cy - demoSpriteSize * 0.72,
            demoSpriteSize,
            demoSpriteSize,
            18,
            WORD_SPRITES[demoWord].bg,
            WORD_SPRITES[demoWord].accent,
            3.5
          );
          drawWordSprite(demoWord, cx, cy - demoSpriteSize * 0.22, demoSpriteSize * 0.8, true);

          const tileS = Math.max(30, Math.min(52, minDim * 0.11));
          const gap = 8;
          const rowW = demoWord.length * tileS + (demoWord.length - 1) * gap;
          demoWord.split("").forEach((ch, idx) => {
            const tx = cx - rowW / 2 + idx * (tileS + gap);
            const ty = cy + demoSpriteSize * 0.36 + (reducedMotion ? 0 : Math.sin(elapsed * 3.5 + idx) * 4);
            const meta = LETTER_META[ch];
            drawRoundedBox(tx, ty, tileS, tileS, 10, meta.fill, meta.rim, 2.5);
            drawVectorLetter(ch, tx + tileS / 2, ty + tileS / 2, tileS * 0.4, "#ffffff", Math.max(3, tileS * 0.12), meta.ink);
          });
          ctx.restore();

          ctx.save();
          ctx.fillStyle = "rgba(14, 9, 36, 0.46)";
          ctx.fillRect(0, 0, W, H);

          const bob = reducedMotion ? 0 : Math.sin(elapsed * 3) * 5;
          const titleSize = Math.max(24, Math.min(62, minDim * 0.125));
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = `900 ${titleSize}px "Courier New", Courier, monospace`;
          const titleY = compact ? cy - titleSize * 0.65 : Math.max(72, H * 0.22);
          ctx.fillStyle = "#120b2e";
          ctx.fillText("WORD BUILDER", cx + 4, titleY + bob + 4);
          ctx.fillStyle = "#ffe14d";
          ctx.fillText("WORD BUILDER", cx, titleY + bob);

          if (!compact) {
            const sGap = Math.max(12, Math.min(24, W * 0.035));
            const btnW = Math.max(124, Math.min(200, (W - 48 - sGap) / 2));
            const btnH = Math.max(66, Math.min(84, H * 0.13));
            const stageY = Math.max(titleY + titleSize * 0.9, H * 0.42);

            stage1Rect = { x: cx - btnW - sGap / 2, y: stageY, w: btnW, h: btnH };
            stage2Rect = { x: cx + sGap / 2, y: stageY, w: btnW, h: btnH };

            [
              { rect: stage1Rect, id: 1, title: "STAGE 1", chars: STAGES[1].letters },
              { rect: stage2Rect, id: 2, title: "STAGE 2", chars: STAGES[2].letters },
            ].forEach((item) => {
              const selected = activeStage === item.id;
              drawRoundedBox(
                item.rect.x,
                item.rect.y,
                item.rect.w,
                item.rect.h,
                18,
                selected ? "rgba(255, 225, 77, 0.26)" : "rgba(18, 11, 46, 0.86)",
                selected ? "#ffe14d" : "#6c72a8",
                selected ? 4 : 2.5
              );
              ctx.font = `900 ${Math.max(13, Math.min(18, btnW * 0.115))}px "Courier New", Courier, monospace`;
              ctx.fillStyle = selected ? "#ffe14d" : "#d0d6ff";
              ctx.fillText(item.title, item.rect.x + item.rect.w / 2, item.rect.y + item.rect.h * 0.28);

              const n = item.chars.length;
              const innerW = item.rect.w - 24;
              const step = innerW / n;
              const lScale = Math.min(step * 0.44, item.rect.h * 0.2);
              const ly = item.rect.y + item.rect.h * 0.68;
              item.chars.forEach((ch, idx) => {
                drawVectorLetter(
                  ch,
                  item.rect.x + 12 + step * (idx + 0.5),
                  ly,
                  lScale,
                  selected ? "#ffffff" : "#99eeff",
                  Math.max(2.4, lScale * 0.22),
                  null
                );
              });
            });

            const playW = Math.max(200, Math.min(280, W * 0.62));
            const playH = Math.max(62, Math.min(78, H * 0.12));
            const playY = Math.min(H - playH - 26, stageY + btnH + Math.max(22, H * 0.05));
            const pulse = reducedMotion ? 1 : 1 + Math.sin(elapsed * 4.2) * 0.035;
            ctx.save();
            ctx.translate(cx, playY + playH / 2);
            ctx.scale(pulse, pulse);
            drawRoundedBox(-playW / 2, -playH / 2, playW, playH, 22, "#ffe14d", "#ff5ca8", 4);
            ctx.font = `900 ${Math.max(22, Math.min(30, playH * 0.44))}px "Courier New", Courier, monospace`;
            ctx.fillStyle = "#120b2e";
            ctx.fillText("▶ TAP TO PLAY", 0, 1);
            ctx.restore();
          } else {
            stage1Rect = { x: 0, y: 0, w: 0, h: 0 };
            stage2Rect = { x: 0, y: 0, w: 0, h: 0 };
            const bw = Math.min(W * 0.78, 180);
            const bh = 38;
            drawRoundedBox(cx - bw / 2, cy + 28, bw, bh, 14, "#ffe14d", "#ff5ca8", 3);
            ctx.font = `900 15px "Courier New", Courier, monospace`;
            ctx.fillStyle = "#120b2e";
            ctx.fillText("▶ TAP TO PLAY", cx, cy + 28 + bh / 2);
          }

          ctx.restore();
        }

        function drawPauseOverlay() {
          if (state !== "paused") return;
          ctx.save();
          ctx.fillStyle = "rgba(12, 8, 30, 0.72)";
          ctx.fillRect(0, 0, W, H);
          const minDim = Math.min(W, H);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = `900 ${Math.max(28, Math.min(54, minDim * 0.11))}px "Courier New", Courier, monospace`;
          ctx.fillStyle = "#ffe14d";
          ctx.fillText("PAUSED", W / 2, H * 0.44);

          const bw = Math.max(190, Math.min(260, W * 0.6));
          const bh = 62;
          drawRoundedBox(W / 2 - bw / 2, H * 0.54, bw, bh, 18, "#38d9ff", "#ffffff", 3.5);
          ctx.font = `900 22px "Courier New", Courier, monospace`;
          ctx.fillStyle = "#120b2e";
          ctx.fillText("▶ TAP TO PLAY", W / 2, H * 0.54 + bh / 2);
          ctx.restore();
        }

        function draw() {
          drawBackground();

          if (state === "title") {
            drawTitleOverlay();
            return;
          }

          drawTopHudBadge();
          drawPictureFrame();
          drawSpeakerButton();
          drawTray();
          drawSlots();

          // Draw non-dragged tiles first, then dragged tile on top!
          for (const t of tiles) {
            if (activeDrag && activeDrag.tile === t) continue;
            drawTile(t, false);
          }
          if (activeDrag) {
            drawTile(activeDrag.tile, true);
          }

          drawEffects();
          drawPauseOverlay();
        }

        // -------------------------------------------------------------------
        // Main Animation Loop
        // -------------------------------------------------------------------
        let lastTime = performance.now();
        function loop(now) {
          const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
          lastTime = now;
          update(dt);
          draw();
          requestAnimationFrame(loop);
        }

        initStars();
        resize();
        syncHud();
        requestAnimationFrame(loop);
      })();
    </script>
    <script src="shared/junior-guard.js" defer></script>
  </body>
</html>
